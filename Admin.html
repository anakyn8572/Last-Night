<section id="gate" class="screen">
  <div class="card auth">
    <h1>Admin</h1>
    <p class="sub">Entrez le code administrateur pour accéder au menu d’administration.</p>

<section id="panel" class="screen hide">
  <div class="card adm">
    <div class="bar"><h1>Administration</h1><button id="out" class="btn ghost">Se déconnecter</button></div>
    <small class="net" id="net"></small>
    <div class="tabs"><button id="tA" class="on">Comptes</button><button id="tT">Corbeille</button></div>
    <input id="q" placeholder="Rechercher un pseudo…" autocomplete="off">

    <div id="list" class="ul"></div>
    <a class="back" href="../index.html">← Retour au jeu</a>

<script>'use strict';
/* ====== Dernière nuit : menu d'administration (page séparée, adresse /admin) ======
   Le code n'est pas écrit en clair : seule son empreinte SHA-256 est stockée ici.
   Attention : cette protection est côté navigateur. Elle masque le menu mais ne remplace pas un vrai serveur. */
const $ = id => document.getElementById(id);
const CODE_HASH = 'f5c4043d1247c3f8dfcea4796f2cab0725274fa82adbfeb9ef48a20e67eab35b';

/* ---------- SHA-256 (sans dépendance) ---------- */
function sha256(str) {
  const K = [], H = []; let n = 2, c = 0;
  while (c < 64) { let p = true; for (let i = 2; i * i <= n; i++) if (n % i === 0) { p = false; break; } if (p) { if (c < 8) H[c] = (Math.pow(n, .5) % 1 * 4294967296) | 0; K[c] = (Math.pow(n, 1 / 3) % 1 * 4294967296) | 0; c++; } n++; }
  const b = [...new TextEncoder().encode(str)], bl = b.length * 8; b.push(0x80); while (b.length % 64 !== 56) b.push(0);
  for (let i = 7; i >= 0; i--) b.push(i > 3 ? 0 : (bl >>> (i * 8)) & 255);
  const rr = (x, k) => (x >>> k) | (x << (32 - k));
  for (let o = 0; o < b.length; o += 64) {
    const w = []; for (let i = 0; i < 16; i++) w[i] = (b[o + i * 4] << 24) | (b[o + i * 4 + 1] << 16) | (b[o + i * 4 + 2] << 8) | b[o + i * 4 + 3];
    for (let i = 16; i < 64; i++) { const s0 = rr(w[i - 15], 7) ^ rr(w[i - 15], 18) ^ (w[i - 15] >>> 3), s1 = rr(w[i - 2], 17) ^ rr(w[i - 2], 19) ^ (w[i - 2] >>> 10); w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0; }
    let [a, bb, cc, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const S1 = rr(e, 6) ^ rr(e, 11) ^ rr(e, 25), ch = (e & f) ^ (~e & g), t1 = (h + S1 + ch + K[i] + w[i]) | 0;
      const S0 = rr(a, 2) ^ rr(a, 13) ^ rr(a, 22), mj = (a & bb) ^ (a & cc) ^ (bb & cc), t2 = (S0 + mj) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = cc; cc = bb; bb = a; a = (t1 + t2) | 0;
    }
    H[0] = (H[0] + a) | 0; H[1] = (H[1] + bb) | 0; H[2] = (H[2] + cc) | 0; H[3] = (H[3] + d) | 0; H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}

/* ====== Stockage partagé (jeu + admin) ======
   1) FB_URL renseigné  -> base Firebase : tous les comptes, tous les appareils.
   2) sinon, base Claude (si la page est publiée comme artefact Claude).
   3) sinon, localStorage : comptes de CET appareil seulement. */
const FB_URL = '';   // ex : 'https://mon-jeu-default-rtdb.europe-west1.firebasedatabase.app'
const LK = 'dn_users_v2';
const lload = () => { try { return JSON.parse(localStorage.getItem(LK)) || {}; } catch (e) { return {}; } };
const lsave = d => { try { localStorage.setItem(LK, JSON.stringify(d)); } catch (e) {} };
let DB = null, MODE = 'local';
async function fb(m, p, body) {
  const r = await fetch(FB_URL.replace(/\/+$/, '') + '/' + p + '.json', { method: m, headers: { 'Content-Type': 'application/json' }, body: body === undefined ? undefined : JSON.stringify(body) });
  if (!r.ok) throw new Error('fb ' + r.status);
  return r.json();
}
async function initOnline() {
  if (FB_URL) { try { await fb('GET', 'players/_ping'); MODE = 'firebase'; return; } catch (e) {} }
  try { if (window.claude && claude.use) { DB = await claude.use('db'); if (DB) MODE = 'claude'; } } catch (e) { DB = null; }
}
async function getUser(k) {
  if (MODE === 'firebase') return await fb('GET', 'players/' + k);
  if (MODE === 'claude') { const s = await DB.doc('players/' + k).get(); return s.data() || null; }
  return lload()[k] || null;
}
async function putUser(k, u) {
  if (MODE === 'firebase') { await fb('PUT', 'players/' + k, u); return; }
  if (MODE === 'claude') { await DB.doc('players/' + k).set(u); return; }
  const d = lload(); d[k] = u; lsave(d);
}
async function patchUser(k, ch) {
  if (MODE === 'firebase') { await fb('PATCH', 'players/' + k, ch); return; }
  const u = (await getUser(k)) || {};
  for (const f in ch) { if (ch[f] === null) delete u[f]; else u[f] = ch[f]; }
  await putUser(k, u);
}
async function dropUser(k) {
  if (MODE === 'firebase') { await fb('DELETE', 'players/' + k); return; }
  if (MODE === 'claude') { await DB.doc('players/' + k).delete(); return; }
  const d = lload(); delete d[k]; lsave(d);
}
async function allUsers(withDel) {
  let a;
  if (MODE === 'firebase') { const o = await fb('GET', 'players'); a = o ? Object.values(o) : []; }
  else if (MODE === 'claude') { const s = await DB.collection('players').limit(500).get(); a = s.docs.map(d => d.data()); }
  else a = Object.values(lload());
  return a.filter(u => u && typeof u === 'object' && u.name && !u.purged && (withDel || !u.del));
}
async function topList(n = 10) {
  return (await allUsers(false)).sort((a, b) => (b.best || 0) - (a.best || 0) || a.name.localeCompare(b.name)).slice(0, n);
}

const keyOf = n => [...n.toLowerCase()].map(c => /[a-z0-9]/.test(c) ? c : '_' + c.charCodeAt(0).toString(36)).join('');
const everyone = () => allUsers(true);

/* ---------- Petits outils ---------- */
const fmt = n => Math.round(n || 0).toLocaleString('fr-FR');
function mk(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function certEl() { const c = mk('i', 'cert', 'OK'); c.title = 'Compte certifié'; return c; }
function avEl(u, s) {
  const ok = u && /^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(u.av || '');
  const e = document.createElement(ok ? 'img' : 'div'); e.className = 'av'; e.style.width = e.style.height = s + 'px';
  if (ok) e.src = u.av; else { e.textContent = (u && u.name ? u.name[0] : '?').toUpperCase(); e.style.background = /^#[0-9a-f]{6}$/i.test(u && u.col || '') ? u.col : '#2a3d5e'; e.style.fontSize = s * .5 + 'px'; }
  return e;
}
function confirmBtn(label, fn, cls) {
  const b = mk('button', 'mini ' + (cls || '') , label); let t = null;
  b.onclick = () => { if (!t) { b.textContent = 'Confirmer ?'; t = setTimeout(() => { b.textContent = label; t = null; }, 3000); return; } clearTimeout(t); t = null; b.textContent = label; fn(); };
  return b;
}
function fresh(u) { return { name: u.name, h: u.h, ip: u.ip, best: 0, games: 0, kills: 0, total: 0, dist: 0, tp: 0, shots: 0, bw: 0, money: 0, earned: 0, dw: ['pistol', 'knife'], dz: [], dp: [], os: [], sk: 'surv', sc: {}, pk: {}, zk: {}, wk: {}, cert: false, vw: [], wl: {}, pl: {}, rv: (u.rv || 0) + 1 }; }

/* ---------- Accès ---------- */
let fails = 0, lockUntil = +localStorage.getItem('dn_admin_lock') || 0, tab = 'A', open = new Set();
function setErr(t) { $('err').textContent = t; if (t && !$('panel').classList.contains('hide')) $('cnt').textContent = t; }
function unlock() { sessionStorage.setItem('dn_admin', '1'); $('gate').classList.add('hide'); $('panel').classList.remove('hide'); draw(); }
function tryCode() {
  if (Date.now() < lockUntil) return setErr('Trop d’essais. Patientez ' + Math.ceil((lockUntil - Date.now()) / 1000) + ' s.');
  if (sha256('dn-admin|' + $('code').value) === CODE_HASH) { fails = 0; setErr(''); $('code').value = ''; return unlock(); }
  if (++fails >= 5) { lockUntil = Date.now() + 60000; fails = 0; try { localStorage.setItem('dn_admin_lock', lockUntil); } catch (e) {} }
  setErr('Code incorrect.'); $('code').select();
}
$('go').onclick = tryCode; $('code').onkeydown = e => { if (e.key === 'Enter') tryCode(); };
$('out').onclick = () => { sessionStorage.removeItem('dn_admin'); $('panel').classList.add('hide'); $('gate').classList.remove('hide'); $('code').focus(); };
$('tA').onclick = () => { tab = 'A'; draw(); }; $('tT').onclick = () => { tab = 'T'; draw(); };
$('q').oninput = () => draw(true);

/* ---------- Panneau ---------- */
let ALL = [];
async function draw(keep) {
  if (!keep) { try { ALL = (await everyone()).sort((a, b) => (b.best || 0) - (a.best || 0)); } catch (e) { ALL = []; setErr('Base injoignable : ' + e.message); } }
  $('net').textContent = MODE !== 'local' ? 'Base en ligne (' + MODE + ') : tous les comptes, tous les appareils' : 'ATTENTION, base locale : seuls les comptes de ce navigateur sont visibles. Renseignez FB_URL (voir le guide).';
  const live = ALL.filter(u => !u.del), bin = ALL.filter(u => u.del);
  $('tA').classList.toggle('on', tab === 'A'); $('tT').classList.toggle('on', tab === 'T'); $('tT').textContent = 'Corbeille' + (bin.length ? ' (' + bin.length + ')' : '');
  const f = $('q').value.trim().toLowerCase(), src = (tab === 'A' ? live : bin).filter(u => u.name.toLowerCase().includes(f));
  $('cnt').textContent = tab === 'A' ? live.length + ' compte' + (live.length > 1 ? 's' : '') + ' actif' + (live.length > 1 ? 's' : '') + '. « Supprimer » envoie le compte dans la corbeille : il pourra être restauré.' : 'Comptes supprimés. Restaurez-les, ou effacez-les définitivement.';
  const ul = $('list'); ul.replaceChildren();
  src.forEach(u => ul.appendChild(tab === 'A' ? rowLive(u) : rowBin(u)));
  if (!src.length) ul.appendChild(mk('small', '', tab === 'A' ? 'Aucun compte trouvé.' : 'La corbeille est vide.'));
}
async function edit(k, fn) {
  try {
    const t = await getUser(k); if (!t) return; const old = JSON.parse(JSON.stringify(t)); fn(t); const ch = {};
    for (const f in t) if (JSON.stringify(t[f]) !== JSON.stringify(old[f])) ch[f] = t[f];
    for (const f in old) if (!(f in t)) ch[f] = null;
    if (Object.keys(ch).length) await patchUser(k, ch);
  } catch (e) { setErr('Erreur de base de données : ' + e.message); }
  await draw();
}
function nameBlock(u, extra) {
  const t = mk('div', 'ut'), n = mk('span', 'nm', u.name); if (u.cert) n.append(' ', certEl());
  t.append(n, mk('small', '', 'Record ' + (u.best || 0) + ' · ' + fmt(u.money) + ' $' + (extra || ''))); return t;
}
function rowLive(u) {
  const k = keyOf(u.name), r = mk('div', 'urow');
  const bi = mk('button', 'mini', open.has(k) ? 'Masquer' : 'Détails'); bi.onclick = () => { open.has(k) ? open.delete(k) : open.add(k); draw(true); };
  const bc = mk('button', 'mini', u.cert ? 'Retirer OK' : 'Certifier'); bc.onclick = () => edit(k, t => { t.cert = !t.cert; });
  const mi = mk('input', 'num'); mi.type = 'number'; mi.placeholder = '± argent';
  const mb = mk('button', 'mini', 'Ajouter / retirer'); mb.onclick = () => { const v = Math.max(-1e7, Math.min(1e7, Math.round(Number(mi.value) || 0))); if (v) edit(k, t => { t.money = Math.min(1e9, Math.max(0, (t.money || 0) + v)); }); };
  const rs = confirmBtn('Réinitialiser', () => edit(k, t => { Object.assign(t, fresh(t)); delete t.av; delete t.col; delete t.bio; }));
  const del = confirmBtn('Supprimer', () => edit(k, t => { t.del = Date.now(); t.rv = (t.rv || 0) + 1; }), 'danger');
  r.append(avEl(u, 38), nameBlock(u), bi, bc, mi, mb, rs, del);
  if (open.has(k)) {
    const d = mk('div', 'det'), sum = o => Object.values(o || {}).reduce((a, b) => a + b, 0);
    [['Parties', u.games || 0], ['Zombies tués', u.kills || 0], ['Meilleure vague', u.bw || 0], ['Points (total)', u.total || 0], ['Argent gagné', fmt(u.earned) + ' $'], ['Armes trouvées', (u.dw || []).length], ['Pouvoirs trouvés', (u.dp || []).length], ['Pouvoirs utilisés', sum(u.pk)], ['Vues du profil', (u.vw || []).length], ['IP secrète', u.ip ? '••••••••••' : '—']]
      .forEach(([l, v]) => { const t = mk('div', 'tile'), b = mk('b', '', v); t.append(b, mk('span', '', l));
        if (l === 'IP secrète' && u.ip) { const s = mk('button', 'mini', 'Afficher'); s.onclick = () => { const h = b.textContent.includes('•'); b.textContent = h ? u.ip : '••••••••••'; s.textContent = h ? 'Masquer' : 'Afficher'; }; t.append(s); }
        d.appendChild(t); });
    r.appendChild(d);
  }
  return r;
}
function rowBin(u) {
  const k = keyOf(u.name), r = mk('div', 'urow'), when = u.del && u.del > 1 ? ' · supprimé le ' + new Date(u.del).toLocaleDateString('fr-FR') : '';
  const re = mk('button', 'mini', 'Restaurer'); re.onclick = () => edit(k, t => { delete t.del; t.rv = (t.rv || 0) + 1; });
  const pg = confirmBtn('Effacer définitivement', async () => { try { await dropUser(k); } catch (e) { setErr('Suppression impossible : ' + e.message); } await draw(); }, 'danger');
  r.append(avEl(u, 38), nameBlock(u, when), re, pg); return r;
}

initOnline().then(() => { if (sessionStorage.getItem('dn_admin') === '1') unlock(); else $('code').focus(); });
</script>
